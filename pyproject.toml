[project]
name = "adaptive-aiops"
version = "0.0.1"
description = "Adaptive AIOps + SRE Ops — POC platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Internal" }

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
    "sqlmodel>=0.0.22",
    "truststore>=0.10.4",
]

[project.optional-dependencies]
llm-anthropic = ["anthropic>=0.39"]
llm-openai = ["openai>=1.40"]
llm-ollama = ["ollama>=0.3"]
all-llm = ["anthropic>=0.39", "openai>=1.40", "ollama>=0.3"]

# Embedding similarity for Alert Triage dedup (workflow step 4).
# Optional: agents fall back to rule-based dedup when this is not installed.
# Install with: uv sync --extra embeddings
embeddings = ["sentence-transformers>=2.7", "numpy>=1.26"]

# Demo UI (FastAPI service + static frontend in demo/ui/).
# Install with: uv sync --extra ui
# kubernetes: required by aiops/tools/feature_flags/ (ARCH-1) for SSA-correct
# patches against the flagd-config ConfigMap. The CLI under
# demo/failure_injection/inject.py also depends on this seam.
ui = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "prometheus-client>=0.20",
    "kubernetes>=29",
]

# ITSM providers (RA-003 Auto-Ticketing — ServiceNow via aiops/tools/itsm/).
# Organizational only: httpx is already a core dep. Declaring the extra makes
# intent visible and gives `uv sync --extra itsm` as a discoverable surface.
itsm = ["httpx>=0.27"]

dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiops", "agents", "evals", "demo"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    # Local worktrees Claude Code creates for parallel sessions; not source.
    ".claude/worktrees",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long — handled by formatter where possible
    "RUF001", # ambiguous Unicode in strings (× / ‒) — intentional in this codebase's docs
    "RUF002", # ambiguous Unicode in docstrings — same reasoning
    "RUF003", # ambiguous Unicode in comments (α, en-dash) — intentional math/typographic notation
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]
"agents/_template/**" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests", "aiops", "evals"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
# Per-test wall-clock cap (#113). Default is 60s; tests waiting on
# HITL approval / asyncio events must override with @pytest.mark.timeout(N)
# rather than blocking the whole suite. timeout_method="thread" works
# on Windows where signal-based timeouts don't.
timeout = 60
timeout_method = "thread"
markers = [
    "integration: requires a running cluster or external service",
    "llm: hits a real LLM API (skipped in CI by default)",
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
