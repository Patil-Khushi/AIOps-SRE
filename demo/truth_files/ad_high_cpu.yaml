scenario_id: ad_high_cpu
title: Ad service CPU saturation
last_updated: '2026-05-21'
owner: poc-team
real_cause:
  layer: application
  component: ad
  description: flagd flag `adHighCpu` is on, causing the ad service to consume CPU above 80% of its limit.
    Triggers HPA scaling but never relieves because the CPU spike is synthetic.
expected_rca:
  cause_summary: Ad service CPU usage is pegged above 80%. HPA has scaled out additional replicas but
    CPU stays high. flagd shows `adHighCpu=on`. The CPU consumption is injected by the flag, not driven
    by traffic.
  evidence_signals:
  - AdCpuHigh alert firing
  - container_cpu_usage{service_name="ad"} > 0.8 sustained
  - 'flagd config: adHighCpu=on'
  ranked_hypotheses:
  - adHighCpu feature flag is enabled
  - Real CPU-bound regression in ad service
  - Background batch job stuck in tight loop
  confidence_floor: 0.7
expected_fix_steps:
- description: Flip adHighCpu to `off` in flagd configmap.
  blast_radius: low
  rollback: Flip the flag back to its previous variant in the flagd configmap.
  requires_hitl: false
- description: If CPU stays high after flag-off, restart ad pods to clear any in-process accumulated work.
  blast_radius: medium
  rollback: kubectl rollout undo for the affected deployment.
  requires_hitl: true
known_wrong_fixes:
- description: Increase ad pod CPU limit
  why_wrong: Won't help — the synthetic CPU consumption scales to whatever limit is set.
scoring:
  rca_must_include:
  - adHighCpu
  - CPU
  fix_step_match: any-of
  max_time_to_rca_seconds: 180
notes: Generated by scripts/generate_truth_files.py for DEMO-12 (#64). Refine the cause/fix narrative
  as the agents' real RCA output matures.
