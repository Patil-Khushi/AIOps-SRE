scenario_id: ad_failure
title: Ad service failure
last_updated: '2026-05-21'
owner: poc-team
real_cause:
  layer: application
  component: ad
  description: flagd flag `adFailure` is on. The ad service returns 5xx — homepage banners render with
    placeholders or disappear entirely.
expected_rca:
  cause_summary: 'Ad service error rate spike. Frontend banner-fetch calls fail. flagd shows `adFailure=on`.
    Likely cause: the flag was flipped on.'
  evidence_signals:
  - AdErrorRateHigh alert firing
  - rate(traces_span_metrics_calls_total{service_name="ad",status_code="STATUS_CODE_ERROR"}[1m]) > 0
  - 'flagd config: adFailure=on'
  ranked_hypotheses:
  - adFailure feature flag is enabled
  - Ad service OOM / pod crashloop
  - Ad's downstream LLM dependency unreachable
  confidence_floor: 0.7
expected_fix_steps:
- description: Flip adFailure to `off` in flagd configmap.
  blast_radius: low
  rollback: Flip the flag back to its previous variant in the flagd configmap.
  requires_hitl: false
- description: If errors persist, check ad pod logs and restart if necessary.
  blast_radius: medium
  rollback: kubectl rollout undo for the affected deployment.
  requires_hitl: true
known_wrong_fixes: []
scoring:
  rca_must_include:
  - adFailure
  - feature flag
  fix_step_match: any-of
  max_time_to_rca_seconds: 180
notes: Generated by scripts/generate_truth_files.py for DEMO-12 (#64). Refine the cause/fix narrative
  as the agents' real RCA output matures.
