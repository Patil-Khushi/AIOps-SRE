scenario_id: email_memory_leak
title: Email service memory leak
last_updated: '2026-05-21'
owner: poc-team
real_cause:
  layer: application
  component: email
  description: flagd flag `emailMemoryLeak` is set to `100x`, causing the email service to leak memory
    ~100× normal rate. RSS grows steadily until the pod OOM-kills.
expected_rca:
  cause_summary: Email service RSS is rising linearly over the last 30 minutes. flagd shows `emailMemoryLeak`
    variant `100x`. The leak is synthetic, injected by the flag — RSS will keep rising until OOMKilled
    and the pod restarts.
  evidence_signals:
  - EmailMemoryHigh alert firing
  - container_memory_rss_bytes{service_name="email"} rising monotonically
  - 'flagd config: emailMemoryLeak variant `100x`'
  ranked_hypotheses:
  - emailMemoryLeak feature flag is at 100x
  - Recent email service deploy introduced a real leak
  - Garbage collector tuning regression
  confidence_floor: 0.7
expected_fix_steps:
- description: Flip emailMemoryLeak to `off` in flagd configmap.
  blast_radius: low
  rollback: Flip the flag back to its previous variant in the flagd configmap.
  requires_hitl: false
- description: Restart email pod (`kubectl -n otel-demo rollout restart deploy/email`) to reclaim leaked
    memory.
  blast_radius: medium
  rollback: kubectl rollout undo for the affected deployment.
  requires_hitl: true
known_wrong_fixes:
- description: Increase email pod memory limit
  why_wrong: Treats the symptom, not the cause; the leak will fill any limit.
scoring:
  rca_must_include:
  - emailMemoryLeak
  - memory
  fix_step_match: any-of
  max_time_to_rca_seconds: 180
notes: Generated by scripts/generate_truth_files.py for DEMO-12 (#64). Refine the cause/fix narrative
  as the agents' real RCA output matures.
