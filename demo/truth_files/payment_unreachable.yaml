scenario_id: payment_unreachable
title: Payment unreachable
last_updated: '2026-05-21'
owner: poc-team
real_cause:
  layer: network
  component: payment
  description: flagd flag `paymentUnreachable` is on, simulating a connection-refused failure between
    checkout and payment. Payment is healthy in isolation but unreachable from upstream callers.
expected_rca:
  cause_summary: 'Checkout''s outbound calls to payment fail with connection-refused. Payment itself is
    up and serving the few direct requests that reach it. flagd shows `paymentUnreachable` is on. Likely
    cause: the flag is simulating a network partition between checkout and payment.'
  evidence_signals:
  - PaymentErrorRateHigh alert firing on the calling side
  - checkout span error.message contains "connection refused"
  - 'flagd config: paymentUnreachable=on'
  ranked_hypotheses:
  - paymentUnreachable feature flag is enabled
  - Network policy blocking checkout → payment
  - Service discovery (DNS) returning stale endpoints
  confidence_floor: 0.7
expected_fix_steps:
- description: Flip paymentUnreachable to `off` in flagd configmap.
  blast_radius: low
  rollback: Flip the flag back to its previous variant in the flagd configmap.
  requires_hitl: false
- description: If unreachable persists after the flag flip, restart frontend-proxy.
  blast_radius: medium
  rollback: kubectl rollout undo for the affected deployment.
  requires_hitl: true
known_wrong_fixes:
- description: Restart payment pods
  why_wrong: Payment is healthy; restarting it would not change the simulated network failure.
scoring:
  rca_must_include:
  - paymentUnreachable
  - feature flag
  fix_step_match: any-of
  max_time_to_rca_seconds: 180
notes: Generated by scripts/generate_truth_files.py for DEMO-12 (#64). Refine the cause/fix narrative
  as the agents' real RCA output matures.
