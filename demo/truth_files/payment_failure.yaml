scenario_id: payment_failure
title: Payment failure (HTTP 500s)
last_updated: '2026-05-21'
owner: poc-team
real_cause:
  layer: application
  component: payment
  description: flagd flag `paymentFailure` is set to `100%`, causing the payment service's `Charge` gRPC
    handler to deterministically return an error for every call. Not a real outage — injected via feature
    flag.
expected_rca:
  cause_summary: 'Payment service error rate is 100% across all charges. Span metrics for the payment
    service show `status_code=STATUS_CODE_ERROR` on every Charge span. The `paymentFailure` flag in flagd-config
    is at `100%`. Likely cause: the flag was flipped on; payment is rejecting every charge. Confirm by
    reading the flagd ConfigMap.'
  evidence_signals:
  - PaymentErrorRateHigh alert firing
  - rate(traces_span_metrics_calls_total{service_name="payment",status_code="STATUS_CODE_ERROR"}[2m])
    > 0
  - 'flagd config: paymentFailure variant `100%` active'
  ranked_hypotheses:
  - paymentFailure feature flag is enabled
  - Recent regression in payment.Charge handler
  - Downstream dependency (Redis/DB) failure cascading to payment
  confidence_floor: 0.7
expected_fix_steps:
- description: Flip paymentFailure variant to `off` in flagd configmap.
  blast_radius: low
  rollback: Flip the flag back to its previous variant in the flagd configmap.
  requires_hitl: false
- description: Restart payment pods if the flag flip doesn't recover within 60s.
  blast_radius: medium
  rollback: kubectl rollout undo for the affected deployment.
  requires_hitl: true
known_wrong_fixes:
- description: Scale up payment pods
  why_wrong: Capacity is not the bottleneck — every request still fails 100%.
- description: Restart the database
  why_wrong: DB is healthy; the error originates in the application layer.
scoring:
  rca_must_include:
  - paymentFailure
  - feature flag
  fix_step_match: any-of
  max_time_to_rca_seconds: 180
notes: Generated by scripts/generate_truth_files.py for DEMO-12 (#64). Refine the cause/fix narrative
  as the agents' real RCA output matures.
