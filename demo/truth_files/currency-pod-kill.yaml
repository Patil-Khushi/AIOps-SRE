scenario_id: currency-pod-kill
title: Currency service pod is killed mid-request
last_updated: 2026-05-06
owner: poc-team

real_cause:
  layer: compute
  component: currencyservice pod
  description: |
    The currency-service pod was forcibly terminated. Kubernetes restarts it
    automatically (Deployment with replica count >= 1), so the failure window
    is short — typically 15 to 90 seconds depending on image pull cache and
    readiness probe timing.

expected_rca:
  cause_summary: |
    Brief 5xx burst across cart and frontend, traced through to currency
    dependency calls returning UNAVAILABLE. Kubernetes events show "Killing"
    for the currency pod immediately before the burst. By the time RCA runs,
    the new pod is Ready and signals are recovering. Likely cause: pod
    eviction or manual deletion. No indication of an in-app bug.
  evidence_signals:
    - kube_event involving currencyservice with reason=Killing
    - rate(http_server_duration_count{service_name=~"cartservice|frontend",http_status_code=~"5.."}[1m]) spike
    - traces show currency-service spans with error=true during the window
    - currency pod restart_count incremented
  ranked_hypotheses:
    - currency pod terminated externally (correct)
    - currency container OOMKilled (refuted: kube_event reason != OOMKilled)
    - cluster node drained (refuted: only one pod, only one service)
  confidence_floor: 0.7

expected_fix_steps:
  - description: Verify the new pod is Ready; no action needed if so.
    blast_radius: low
    rollback: n/a — observation step
    requires_hitl: false
  - description: If the pod does not come back Ready within 90s, describe events and check image pull state.
    blast_radius: low
    rollback: n/a — diagnostic
    requires_hitl: false
  - description: If repeated kills are observed, raise restart-count alert and investigate node/HPA state.
    blast_radius: low
    rollback: n/a — paging path
    requires_hitl: false

known_wrong_fixes:
  - description: Roll back the currency-service deploy.
    why_wrong: This is not a code regression; the pod was killed externally.
  - description: Scale the deployment up to "fix" availability.
    why_wrong: One replica restarted automatically; scaling adds cost without addressing cause.

scoring:
  rca_must_include:
    - "currencyservice"
    - "killing"
  fix_step_match: any-of
  max_time_to_rca_seconds: 120

notes: |
  Self-healing scenario. Good test of "do not over-react" — the right answer
  is often "monitor, no action". Useful negative example for Auto-Healer.
