scenario_id: image_slow_load_10s
title: Slow image load (10 s)
last_updated: '2026-05-21'
owner: poc-team
real_cause:
  layer: application
  component: frontend
  description: flagd flag `imageSlowLoad` is set to `10sec`, injecting a 10-second delay into the frontend's
    image-fetch path. Frontend p95 page-load latency degrades.
expected_rca:
  cause_summary: Frontend image latency p95 is at 10s. Span metrics show the delay is inside the image-fetch
    span, not in image-provider. flagd shows `imageSlowLoad=10sec`. Synthetic delay injected by the flag.
  evidence_signals:
  - FrontendImageLatencyHigh alert firing
  - frontend image-fetch span duration ≈ 10s consistently
  - 'flagd config: imageSlowLoad variant `10sec`'
  ranked_hypotheses:
  - imageSlowLoad feature flag is set to 10sec
  - Image-provider service slowness
  - CDN or upstream image-host degradation
  confidence_floor: 0.7
expected_fix_steps:
- description: Flip imageSlowLoad to `off` in flagd configmap.
  blast_radius: low
  rollback: Flip the flag back to its previous variant in the flagd configmap.
  requires_hitl: false
- description: If the delay persists, check image-provider pod (`kubectl -n otel-demo logs deploy/image-provider`).
  blast_radius: medium
  rollback: kubectl rollout undo for the affected deployment.
  requires_hitl: true
known_wrong_fixes:
- description: Scale image-provider
  why_wrong: Image-provider is healthy; the delay is injected on the frontend side.
scoring:
  rca_must_include:
  - imageSlowLoad
  - frontend
  fix_step_match: any-of
  max_time_to_rca_seconds: 180
notes: Generated by scripts/generate_truth_files.py for DEMO-12 (#64). Refine the cause/fix narrative
  as the agents' real RCA output matures.
