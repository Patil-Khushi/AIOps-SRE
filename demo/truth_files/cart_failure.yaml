scenario_id: cart_failure
title: Cart failure (HTTP 500s)
last_updated: '2026-05-21'
owner: poc-team
real_cause:
  layer: application
  component: cart
  description: 'flagd flag `cartFailure` is on. The cart service returns a 5xx on every request. Customer
    impact: shopping cart cannot be opened or modified.'
expected_rca:
  cause_summary: 'Cart service error rate is 100%. Span metrics show STATUS_CODE_ERROR across all cart
    operations. flagd shows `cartFailure=on`. Likely cause: the flag was flipped on; cart rejects every
    request.'
  evidence_signals:
  - CartErrorRateHigh alert firing
  - cart span p95 returns 500 across GetCart / AddItem / EmptyCart
  - 'flagd config: cartFailure=on'
  ranked_hypotheses:
  - cartFailure feature flag is enabled
  - Cart's valkey backing store is unreachable
  - Cart deployment is mid-rollback
  confidence_floor: 0.7
expected_fix_steps:
- description: Flip cartFailure to `off` in flagd configmap.
  blast_radius: low
  rollback: Flip the flag back to its previous variant in the flagd configmap.
  requires_hitl: false
- description: If cart errors persist, check valkey-cart pod health (`kubectl -n otel-demo logs deploy/valkey-cart`).
  blast_radius: medium
  rollback: kubectl rollout undo for the affected deployment.
  requires_hitl: true
known_wrong_fixes:
- description: Restart valkey-cart
  why_wrong: Valkey is healthy. Restarting it would only break sessions.
scoring:
  rca_must_include:
  - cartFailure
  - feature flag
  fix_step_match: any-of
  max_time_to_rca_seconds: 180
notes: Generated by scripts/generate_truth_files.py for DEMO-12 (#64). Refine the cause/fix narrative
  as the agents' real RCA output matures.
