scenario_id: loadgen_homepage_flood
title: Homepage traffic surge
last_updated: '2026-05-21'
owner: poc-team
real_cause:
  layer: application
  component: frontend
  description: flagd flag `loadGeneratorFloodHomepage` is on. The load generator amplifies homepage traffic
    to >10 req/s (vs normal ~3 req/s) for the duration the flag is on.
expected_rca:
  cause_summary: Frontend request rate has jumped 3-4x. Span volume is up across all frontend operations.
    flagd shows `loadGeneratorFloodHomepage=on`. Synthetic traffic surge from the load generator, not
    real users.
  evidence_signals:
  - FrontendTrafficSurge alert firing
  - sum(rate(...service_name="frontend")) > 10 req/s
  - 'flagd config: loadGeneratorFloodHomepage=on'
  ranked_hypotheses:
  - loadGeneratorFloodHomepage feature flag is enabled
  - Real traffic surge / promotion campaign
  - Bot or DDoS at the edge
  confidence_floor: 0.7
expected_fix_steps:
- description: Flip loadGeneratorFloodHomepage to `off` in flagd configmap.
  blast_radius: low
  rollback: Flip the flag back to its previous variant in the flagd configmap.
  requires_hitl: false
- description: If real traffic is the cause, scale frontend HPA min replicas up.
  blast_radius: medium
  rollback: kubectl rollout undo for the affected deployment.
  requires_hitl: true
known_wrong_fixes:
- description: Block frontend ingress in NetworkPolicy
  why_wrong: Would also block legitimate traffic; the cause here is internal load generator, not external
    traffic.
scoring:
  rca_must_include:
  - loadGeneratorFloodHomepage
  - traffic
  fix_step_match: any-of
  max_time_to_rca_seconds: 180
notes: Generated by scripts/generate_truth_files.py for DEMO-12 (#64). Refine the cause/fix narrative
  as the agents' real RCA output matures.
