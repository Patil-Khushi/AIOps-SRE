scenario_id: ad_manual_gc
title: Ad service GC stall
last_updated: '2026-05-21'
owner: poc-team
real_cause:
  layer: application
  component: ad
  description: flagd flag `adManualGc` triggers periodic manual GC pauses in the ad service. Visible as
    latency spikes synchronised across all ad-service spans every few seconds.
expected_rca:
  cause_summary: Ad service p95 latency is spiky with sharp peaks. Span duration histograms show bursts
    of slow spans. flagd shows `adManualGc=on`. The GC pauses are synthetic, injected by the flag.
  evidence_signals:
  - AdLatencyP95High alert firing
  - ad span duration histogram shows bimodal distribution
  - 'flagd config: adManualGc=on'
  ranked_hypotheses:
  - adManualGc feature flag is enabled
  - JVM tuning regression in ad service
  - Memory pressure forcing real GC pauses
  confidence_floor: 0.7
expected_fix_steps:
- description: Flip adManualGc to `off` in flagd configmap.
  blast_radius: low
  rollback: Flip the flag back to its previous variant in the flagd configmap.
  requires_hitl: false
- description: If spikes persist, increase ad pod heap size as a temporary mitigation.
  blast_radius: medium
  rollback: kubectl rollout undo for the affected deployment.
  requires_hitl: true
known_wrong_fixes:
- description: Switch ad-service GC algorithm via env var
  why_wrong: Won't help — the GC is synthetic, triggered by the flag, not by real allocation pressure.
scoring:
  rca_must_include:
  - adManualGc
  - GC
  fix_step_match: any-of
  max_time_to_rca_seconds: 180
notes: Generated by scripts/generate_truth_files.py for DEMO-12 (#64). Refine the cause/fix narrative
  as the agents' real RCA output matures.
