scenario_id: recommendation_cache_failure
title: Recommendation cache miss
last_updated: '2026-05-21'
owner: poc-team
real_cause:
  layer: application
  component: recommendation
  description: flagd flag `recommendationCacheFailure` is on, causing the recommendation service to skip
    its in-memory cache and recompute on every request. p95 latency climbs above target.
expected_rca:
  cause_summary: Recommendation latency p95 is elevated. Span metrics show duration up across the board.
    flagd shows `recommendationCacheFailure=on`. Cache is being bypassed; every request recomputes.
  evidence_signals:
  - RecommendationLatencyP95High alert firing
  - histogram_quantile(0.95, ...service_name="recommendation") rising
  - 'flagd config: recommendationCacheFailure=on'
  ranked_hypotheses:
  - recommendationCacheFailure feature flag is enabled
  - Cache backend (Valkey/Redis) unreachable
  - Recent recommendation deployment removed caching path
  confidence_floor: 0.7
expected_fix_steps:
- description: Flip recommendationCacheFailure to `off` in flagd configmap.
  blast_radius: low
  rollback: Flip the flag back to its previous variant in the flagd configmap.
  requires_hitl: false
- description: Once flag is off, warm the cache by issuing a handful of GetRecommendations requests.
  blast_radius: medium
  rollback: kubectl rollout undo for the affected deployment.
  requires_hitl: true
known_wrong_fixes:
- description: Increase recommendation pod CPU limits
  why_wrong: Latency is from cache miss, not CPU saturation.
scoring:
  rca_must_include:
  - recommendationCacheFailure
  - cache
  fix_step_match: any-of
  max_time_to_rca_seconds: 180
notes: Generated by scripts/generate_truth_files.py for DEMO-12 (#64). Refine the cause/fix narrative
  as the agents' real RCA output matures.
