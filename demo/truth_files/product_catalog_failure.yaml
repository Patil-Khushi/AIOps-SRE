scenario_id: product_catalog_failure
title: Product catalog failure
last_updated: '2026-05-21'
owner: poc-team
real_cause:
  layer: application
  component: product-catalog
  description: flagd flag `productCatalogFailure` is on. Product-catalog returns errors on a subset of
    products (the upstream OTel demo's documented behaviour for this flag). Some product pages 5xx; others
    succeed.
expected_rca:
  cause_summary: Product-catalog has a partial error rate — only specific product IDs 5xx. Span metrics
    show STATUS_CODE_ERROR clustered on a subset of GetProduct spans. flagd shows `productCatalogFailure=on`.
  evidence_signals:
  - ProductCatalogErrorRateHigh alert firing
  - rate(traces_span_metrics_calls_total{service_name="product-catalog",status_code="STATUS_CODE_ERROR"}[1m])
    > 0
  - 'flagd config: productCatalogFailure=on'
  ranked_hypotheses:
  - productCatalogFailure feature flag is enabled
  - Bad data for specific product IDs in the catalog DB
  - Partial deployment / canary stuck
  confidence_floor: 0.7
expected_fix_steps:
- description: Flip productCatalogFailure to `off` in flagd configmap.
  blast_radius: low
  rollback: Flip the flag back to its previous variant in the flagd configmap.
  requires_hitl: false
- description: If errors persist, restart product-catalog pods.
  blast_radius: medium
  rollback: kubectl rollout undo for the affected deployment.
  requires_hitl: true
known_wrong_fixes:
- description: Re-import the entire product catalog
  why_wrong: Data is fine; the flag is the issue.
scoring:
  rca_must_include:
  - productCatalogFailure
  - feature flag
  fix_step_match: any-of
  max_time_to_rca_seconds: 180
notes: Generated by scripts/generate_truth_files.py for DEMO-12 (#64). Refine the cause/fix narrative
  as the agents' real RCA output matures.
