scenario_id: kafka_backpressure
title: Kafka queue backpressure
last_updated: '2026-05-21'
owner: poc-team
real_cause:
  layer: data
  component: checkout
  description: flagd flag `kafkaQueueProblems` is on, throttling the Kafka consumer in checkout's downstream
    chain. Queue depth grows; checkout-fed background tasks (accounting, shipping) start erroring out.
expected_rca:
  cause_summary: Kafka consumer lag is climbing for the `orders` topic. Downstream services (accounting,
    shipping) error rates rise as their inputs get stale. flagd shows `kafkaQueueProblems=on`. The consumer-side
    slowness is injected by the flag.
  evidence_signals:
  - CheckoutBackpressureHigh alert firing
  - kafka consumer lag metric > threshold and rising
  - 'flagd config: kafkaQueueProblems=on'
  ranked_hypotheses:
  - kafkaQueueProblems feature flag is enabled
  - Kafka broker under-replicated partitions
  - Consumer pod CPU-throttled by limits
  confidence_floor: 0.7
expected_fix_steps:
- description: Flip kafkaQueueProblems to `off` in flagd configmap.
  blast_radius: low
  rollback: Flip the flag back to its previous variant in the flagd configmap.
  requires_hitl: false
- description: If consumer lag persists, restart accounting + shipping deployments to reset offsets.
  blast_radius: medium
  rollback: kubectl rollout undo for the affected deployment.
  requires_hitl: true
known_wrong_fixes:
- description: Increase Kafka broker memory
  why_wrong: Brokers are healthy; the bottleneck is at the consumer side, not the broker.
scoring:
  rca_must_include:
  - kafkaQueueProblems
  - consumer
  fix_step_match: any-of
  max_time_to_rca_seconds: 180
notes: Generated by scripts/generate_truth_files.py for DEMO-12 (#64). Refine the cause/fix narrative
  as the agents' real RCA output matures.
