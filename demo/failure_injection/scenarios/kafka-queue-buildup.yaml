id: kafka-queue-buildup
title: Kafka consumer falls behind, queue grows unbounded
description: |
  Toggles the upstream OTel demo flag that injects a delay in the Kafka
  consumer (the ad service or accounting service, depending on chart version).
  Manifests as growing Kafka consumer-lag metric and downstream order-processing
  delays.

  Tests dependency-aware reasoning: the symptom is in checkout, the cause is
  in the consumer.

mechanism: flagd
flagd:
  flag_key: kafkaQueueProblems
  variant: "on"

expected_signals:
  - prometheus_metric: kafka_consumer_lag > 1000
  - prometheus_metric: rate(http_server_duration_count{service_name="frontend",http_status_code=~"5.."}[2m]) > 0
  - log_pattern: "consumer.*falling behind|backpressure"

duration_seconds: 900
clears_on: failure_injection.inject --clear
