id: currency-pod-kill
title: Currency service pod is killed mid-request
description: |
  Uses kubectl (Phase-0 fallback) or Chaos Mesh PodChaos (when Chaos Mesh is
  installed) to terminate the currency-service pod. Demonstrates a hard-failure
  scenario rather than a soft degradation.

  Tests: blast-radius reasoning (currency is a dependency for cart/payment),
  Auto-Healer's restart action, and Incident Commander timeline behaviour.

mechanism: kubectl
kubectl:
  namespace: otel-demo
  # Chart 0.40.x dropped the '-service' suffix on component labels.
  # Verify with: kubectl -n otel-demo get pod -l app.kubernetes.io/component=currency
  selector: app.kubernetes.io/component=currency
  action: delete-pod

expected_signals:
  - kube_event: "Killing.*currencyservice"
  - prometheus_metric: rate(http_server_duration_count{service_name=~"cartservice|frontend",http_status_code=~"5.."}[1m]) > 0
  - trace_pattern: span.currency.error == true

duration_seconds: 120
clears_on: kubernetes-restarts-pod-automatically
