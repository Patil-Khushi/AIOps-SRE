id: slow-product-catalog
title: Product catalog service responds slowly under load
description: |
  Toggles the upstream OTel demo flag that injects latency into the
  product-catalog service. Latency manifests as elevated p95 across
  /productcatalog endpoints; checkout indirectly degrades.

  This is the easiest demo failure — single service, single signal, recoverable
  by flag-off. Good first test for Alert Triage and Log Correlation agents.

mechanism: flagd
flagd:
  flag_key: productCatalogFailure
  variant: "on"

expected_signals:
  - prometheus_metric: histogram_quantile(0.95, rate(http_server_duration_bucket{service_name="productcatalogservice"}[1m]))
  - log_pattern: "GetProduct.*timed out"
  - trace_pattern: span.product-catalog.duration > 500ms

duration_seconds: 600
clears_on: failure_injection.inject --clear
