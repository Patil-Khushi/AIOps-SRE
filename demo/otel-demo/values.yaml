# Helm values for the OpenTelemetry Demo chart.
# Chart: open-telemetry/opentelemetry-demo (tested against 0.40.7, appVersion 2.2.0)
# Installed by the Helm command in ONBOARDING.md (and infra/bootstrap.ps1).
#
# Phase-0 strategy: accept the chart's defaults for components and only override
# what we have to. The chart already ships Grafana, Prometheus, Jaeger, and
# OpenSearch as sub-charts; we disable OpenSearch because it's the heaviest
# (and we don't need it on 16 GB laptops).
#
# Per-component resource tuning is intentionally deferred. The chart's defaults
# fit comfortably in the 6 GB Rancher Desktop allocates to k3s. If a specific
# component OOMs, override it under `components:` using the chart's expected
# key names — see `helm show values open-telemetry/opentelemetry-demo`.

default:
  envOverrides:
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: deployment.environment=poc
opensearch:
  enabled: false
# DEMO-8 / #60: server-side panel rendering so RA-003 Auto-Ticketing can attach
# the breaching Grafana panel as a PNG to the ServiceNow incident (a triager
# sees the graph without leaving the ticket). Enabled as a SEPARATE renderer pod
# (imageRenderer.enabled) rather than the in-pod GF_INSTALL_PLUGINS route: the
# stock Grafana image lacks the Chromium shared libs the in-pod plugin needs, so
# the sidecar is the path Grafana Labs recommends and the one most likely to
# work unattended. The chart wires GF_RENDERING_SERVER_URL / _CALLBACK_URL
# automatically when this is on. Costs one extra small pod (~a few hundred MB) —
# acceptable on the 6 GB k3s VM.
#
# Validated 2026-07-06 against a live OTel demo + ServiceNow PDI (incident
# INC0011073 carried the ~85 KB Collector-Overview PNG). Dashboard UID + panel
# mapping live in agents/auto_ticketing/grafana_panels.json — see its _verify
# entry for the confirmed values.
grafana:
  imageRenderer:
    enabled: true
    # Grafana here is served under the /grafana sub-path (root_url +
    # serve_from_sub_path, behind the frontend-proxy). The renderer's headless
    # browser calls back to Grafana to load the panel, but the chart's default
    # callback URL omits that prefix — so it requests /d-solo/... instead of
    # /grafana/d-solo/... and Grafana returns 500. grafanaSubPath appends the
    # prefix to GF_RENDERING_CALLBACK_URL (-> http://grafana.<ns>:80/grafana/).
    # Trailing slash matters — the renderer joins it as <callback> + "d-solo/…".
    grafanaSubPath: grafana/
  # Enabling imageRenderer changes the Grafana pod template (triggers a rollout),
  # but single-node k3s on a 16 GB laptop can't hold two Grafana pods at once.
  # The default RollingUpdate (maxSurge 25%) starts the new pod before removing
  # the old one, so the new pod stays Pending on "Insufficient memory" and helm
  # --wait times out. maxSurge=0 / maxUnavailable=1 flips the order: the old pod
  # is removed first, then the new one schedules into the freed memory. Kept as
  # RollingUpdate (not Recreate) on purpose — switching an already-deployed
  # cluster to Recreate fails with "rollingUpdate may not be specified when type
  # is Recreate". Brief Grafana downtime on upgrade is fine for a demo.
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
prometheus:
  server:
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
  # Scrape the AIOps demo UI server's /metrics endpoint. The UI runs on the
  # host (out of cluster) and exposes ``aiops_scenario_active`` — a synthetic
  # gauge that flips to 1 whenever a scenario flag is in a non-off variant.
  # ``host.docker.internal`` is Rancher Desktop's host-loopback alias and was
  # verified reachable from inside the prometheus pod via ``kubectl exec``.
  extraScrapeConfigs: |
    - job_name: aiops-ui
      # 5s (vs the global 15s): this job scrapes one tiny /metrics endpoint, so
      # the extra load is negligible, and it shaves up to 10s off how fast the
      # aiops_scenario_active gauge flip reaches Prometheus after an inject.
      scrape_interval: 5s
      static_configs:
        - targets: ['host.docker.internal:8765']
          labels:
            origin: aiops-platform
  serverFiles:
    alerting_rules.yml:
      groups:
      - name: aiops-demo
        # 10s (vs 30s): evaluate the demo alert rules 3x more often so a
        # firing condition is picked up within ~10s instead of up to 30s.
        # ~14 lightweight rules, so the extra evaluation cost is trivial.
        interval: 10s
        rules:
        # Payment uses gRPC and the OTel collector doesn't enrich http_status_code,
        # so HTTP-based detection silently never fires. Span-metric error rate
        # is the same pattern ProductCatalogErrorRateHigh below uses. The [2m]
        # window (vs [1m] elsewhere) is intentional: span-metrics for payment
        # arrive every ~16s, so [1m] frequently has <2 samples and rate() returns
        # empty — verified live against this cluster.
        - alert: PaymentErrorRateHigh
          expr: "sum by (service_name) (\n  rate(traces_span_metrics_calls_total{service_name=\"\
            payment\",status_code=\"STATUS_CODE_ERROR\"}[2m])\n) > 0\n"
          for: 15s
          labels:
            severity: critical
            service: payment
            alert_type: error_rate
          annotations:
            summary: Payment service producing error spans
            description: service={{ $labels.service_name }} error_rate={{ $value }}/s
            runbook_url: https://runbooks.example.com/payment-cpu
            flag_hint: toggle paymentFailure=on at http://localhost:8080/feature/
        - alert: CartErrorRateHigh
          expr: "histogram_quantile(0.95, sum by (le, service_name) (\n  rate(traces_span_metrics_duration_milliseconds_bucket{service_name=\"\
            cart\"}[1m])\n)) > 8\n"
          for: 15s
          labels:
            severity: high
            service: cart
            alert_type: error_rate
          annotations:
            summary: Cart service p95 latency elevated (cartFailure side-effects)
            description: service={{ $labels.service_name }} p95={{ $value }}ms
            runbook_url: https://runbooks.example.com/cart
            flag_hint: toggle cartFailure=on at http://localhost:8080/feature/
        - alert: ProductCatalogErrorRateHigh
          expr: "sum by (service_name) (\n  rate(traces_span_metrics_calls_total{service_name=\"product-catalog\",status_code=\"\
            STATUS_CODE_ERROR\"}[1m])\n) > 0\n"
          for: 15s
          labels:
            severity: high
            service: product-catalog
            alert_type: error_rate
          annotations:
            summary: Product catalog producing error spans
            description: service={{ $labels.service_name }} error_rate={{ $value }}/s
            runbook_url: https://runbooks.example.com/catalog
            flag_hint: toggle productCatalogFailure=on at http://localhost:8080/feature/
        - alert: RecommendationLatencyP95High
          expr: "histogram_quantile(0.95, sum by (le, service_name) (\n  rate(traces_span_metrics_duration_milliseconds_bucket{service_name=\"\
            recommendation\"}[1m])\n)) > 10\n"
          for: 15s
          labels:
            severity: high
            service: recommendation
            alert_type: latency
          annotations:
            summary: Recommendation service p95 latency above 200 ms
            description: service={{ $labels.service_name }} p95={{ $value }}ms
            runbook_url: https://runbooks.example.com/recommendation
            flag_hint: toggle recommendationCacheFailure=on at http://localhost:8080/feature/
        - alert: RecommendationErrorRateHigh
          expr: "sum by (service_name) (\n  rate(traces_span_metrics_calls_total{service_name=\"recommendation\",status_code=\"\
            STATUS_CODE_ERROR\"}[1m])\n) > 0\n"
          for: 15s
          labels:
            severity: high
            service: recommendation
            alert_type: error_rate
          annotations:
            summary: Recommendation service producing error spans
            description: service={{ $labels.service_name }} error_rate={{ $value }}/s
            runbook_url: https://runbooks.example.com/recommendation
            flag_hint: toggle recommendationCacheFailure=on at http://localhost:8080/feature/
        - alert: FrontendTrafficSurge
          expr: "sum by (service_name) (\n  rate(http_client_duration_milliseconds_count{service_name=\"frontend\"}[1m])\n\
            ) > 10\n"
          for: 15s
          labels:
            severity: warning
            service: frontend
            alert_type: traffic
          annotations:
            summary: Frontend request rate above 10 req/s (load surge)
            description: service={{ $labels.service_name }} rate={{ $value }}/s
            runbook_url: https://runbooks.example.com/frontend
            flag_hint: toggle loadGeneratorFloodHomepage=on at http://localhost:8080/feature/
        - alert: AdErrorRateHigh
          expr: "sum by (service_name) (\n  rate(traces_span_metrics_calls_total{service_name=\"ad\",status_code=\"STATUS_CODE_ERROR\"\
            }[1m])\n) > 0\n"
          for: 15s
          labels:
            severity: high
            service: ad
            alert_type: error_rate
          annotations:
            summary: Ad service producing error spans
            description: service={{ $labels.service_name }} error_rate={{ $value }}/s
            runbook_url: https://runbooks.example.com/ad
            flag_hint: toggle adFailure=on at http://localhost:8080/feature/
        - alert: AdLatencyP95High
          expr: "histogram_quantile(0.95, sum by (le, service_name) (\n  rate(traces_span_metrics_duration_milliseconds_bucket{service_name=\"\
            ad\"}[1m])\n)) > 10\n"
          for: 15s
          labels:
            severity: high
            service: ad
            alert_type: latency
          annotations:
            summary: Ad service p95 latency above 200 ms
            description: service={{ $labels.service_name }} p95={{ $value }}ms
            runbook_url: https://runbooks.example.com/ad
            flag_hint: toggle adManualGc=on at http://localhost:8080/feature/
        - alert: AdCpuHigh
          expr: "avg by (service_name) (\n  container_cpu_usage{service_name=\"ad\"}\n) > 0.3\n"
          for: 15s
          labels:
            severity: warning
            service: ad
            alert_type: saturation
          annotations:
            summary: Ad service CPU above 30%
            description: service={{ $labels.service_name }} cpu_usage={{ $value }}
            runbook_url: https://runbooks.example.com/ad
            flag_hint: toggle adHighCpu=on at http://localhost:8080/feature/
        - alert: FrontendImageLatencyHigh
          expr: "histogram_quantile(0.95, sum by (le, service_name) (\n  rate(traces_span_metrics_duration_milliseconds_bucket{service_name=\"\
            frontend\"}[1m])\n)) > 200\n"
          for: 15s
          labels:
            severity: high
            service: frontend
            alert_type: latency
          annotations:
            summary: Frontend p95 latency above 1.5 s (likely slow image loads)
            description: service={{ $labels.service_name }} p95={{ $value }}ms
            runbook_url: https://runbooks.example.com/frontend
            flag_hint: toggle imageSlowLoad=10sec at http://localhost:8080/feature/
        - alert: CheckoutBackpressureHigh
          expr: "sum by (service_name) (\n  rate(traces_span_metrics_calls_total{service_name=\"checkout\",status_code=\"\
            STATUS_CODE_ERROR\"}[1m])\n) > 0\n"
          for: 15s
          labels:
            severity: high
            service: checkout
            alert_type: backpressure
          annotations:
            summary: Checkout pipeline returning errors (likely Kafka backpressure)
            description: service={{ $labels.service_name }} non-2xx rate={{ $value }}/s
            runbook_url: https://runbooks.example.com/checkout
            flag_hint: toggle kafkaQueueProblems=on at http://localhost:8080/feature/
        - alert: EmailMemoryHigh
          expr: "avg by (service_name) (\n  container_memory_rss_bytes{service_name=\"email\"}\n) > 100000000\n"
          for: 15s
          labels:
            severity: high
            service: email
            alert_type: memory
          annotations:
            summary: Email service RSS memory above 100 MB
            description: service={{ $labels.service_name }} rss_bytes={{ $value }}
            runbook_url: https://runbooks.example.com/email
            flag_hint: toggle emailMemoryLeak=100x at http://localhost:8080/feature/
        # Plan B (Tier 1) — synthetic signal from demo/ui/server.py's /metrics
        # endpoint. Fires for every scenario the dashboard's Failure Injection
        # panel can inject, including those whose application instrumentation
        # never tags spans as STATUS_CODE_ERROR (paymentFailure et al.).
        # Coexists with the *ErrorRateHigh rules above — those still fire when
        # real error data is present; this fires unconditionally on flag flip.
        - alert: ScenarioActive
          expr: aiops_scenario_active > 0
          # for: 0s — fire on the first evaluation where the gauge is set. The
          # gauge is a stable binary signal driven by an explicit inject (no
          # flapping), so there's no reason to hold it pending. Removes 15s of
          # latency on the demo's fast-path alert.
          for: 0s
          labels:
            # Per-scenario severity carried on the aiops_scenario_active gauge
            # (demo/ui/server.py) and sourced from demo/scenarios/*.yaml. RA-001
            # maps it generically (critical->Sev-1, high->Sev-2, warning->Sev-3)
            # via severity_hint — no flag-name lookup in the agent.
            severity: '{{ $labels.severity }}'
            alert_type: scenario_active
          annotations:
            summary: 'Scenario {{ $labels.scenario_id }} active on {{ $labels.service }}'
            description: 'flag={{ $labels.flag }} is in a non-off variant; the UI surfaced this via /metrics'
            flag_hint: 'reset via .\reset.ps1 or the dashboard Reset All button'
            runbook_url: 'https://runbooks.example.com/scenario-active'
