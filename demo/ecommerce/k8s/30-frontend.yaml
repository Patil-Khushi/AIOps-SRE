# React SPA, served by nginx.
#
# The frontend is client-side: the browser — not the pod — calls the backends.
# So VITE_* must be URLs the BROWSER can reach, which means NodePorts on
# localhost, not in-cluster DNS. Point these at http://user-service:8000 and
# every request fails with an unresolvable host.
#
# docker-entrypoint.sh regenerates /usr/share/nginx/html/config.js from these
# env vars at container start, so changing them needs only a rollout restart.
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ecommerce
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        service_name: ecommerce-frontend
    spec:
      containers:
        - name: frontend
          image: ecommerce/frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: VITE_USER_SERVICE_URL
              value: "http://localhost:30081"
            - name: VITE_ORDER_SERVICE_URL
              value: "http://localhost:30082"
          resources:
            requests: {memory: "64Mi", cpu: "50m"}
            limits: {memory: "128Mi", cpu: "500m"}
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 5
            periodSeconds: 10
