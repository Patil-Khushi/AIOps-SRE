# Promtail DaemonSet — ships ecommerce pod logs into Loki.
#
# WHY THIS IS NEEDED: the OTel Collector's logs pipeline has exactly one
# receiver, `otlp`. It has NO filelog receiver, so it never reads container
# stdout. The ecommerce services write structured JSON to stdout and export
# only traces over OTLP — so without this DaemonSet their logs reach nothing.
# Verify the gap with:
#   kubectl -n otel-demo get cm otel-collector-agent -o jsonpath='{.data.relay}' \
#     | sed -n '/^receivers:/,/^service:/p'
#
# This replaces the Compose-side promtail container in docker-compose.yml.
# Run both only while migrating, or every log line is stored twice.
#
# Scoped to the `ecommerce` namespace on purpose: otel-demo workloads already
# reach Loki through the collector, and duplicating them would double-count.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: ecommerce
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail-ecommerce
rules:
  # Pod discovery only. No write verbs anywhere — a log shipper never needs to
  # mutate cluster state, and the agents' blast-radius story is easier to argue
  # when the collection path is provably read-only.
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail-ecommerce
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail-ecommerce
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: ecommerce
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: ecommerce
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      # In-cluster DNS — no NodePort needed now that this runs inside k3s.
      - url: http://loki.otel-demo.svc.cluster.local:3100/loki/api/v1/push
        backoff_config:
          min_period: 500ms
          max_period: 5m
          max_retries: 10

    scrape_configs:
      - job_name: ecommerce-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [ecommerce]

        relabel_configs:
          # Only pods scheduled on this node — each DaemonSet replica reads the
          # local /var/log/pods, so without this every node tails every pod.
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: __host__

          # service_name is the label log_correlation queries and the join key
          # across metrics/logs/traces. Pods carry it explicitly (see 20-app.yaml)
          # so it matches OTEL_SERVICE_NAME exactly.
          - source_labels: [__meta_kubernetes_pod_label_service_name]
            target_label: service_name
          # Datastore pods have the label too; this is a safety net for any pod
          # that doesn't, so it lands under its app name rather than empty.
          - source_labels: [service_name, __meta_kubernetes_pod_label_app]
            regex: ";(.+)"
            target_label: service_name
            replacement: "ecommerce-$1"

          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container

          # Path to the on-disk log file for this container.
          - source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            separator: /
            target_label: __path__
            replacement: /var/log/pods/*$1/*.log

        pipeline_stages:
          # k3s writes CRI-format lines: "<ts> <stream> <flags> <message>".
          # Without this the JSON stage below sees the CRI prefix and fails.
          - cri: {}
          # App services emit JSON; datastores (mysql/postgres/redis) emit plain
          # text. The json stage fails soft on those and the line passes through.
          - json:
              expressions:
                level: level
                message: message
          - labels:
              level:
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: ecommerce
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
        service_name: ecommerce-promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.0.0
          args:
            - -config.file=/etc/promtail/promtail.yaml
            # Each DaemonSet pod tails only its own node's files.
            - -config.expand-env=true
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests: {memory: "64Mi", cpu: "50m"}
            limits: {memory: "192Mi", cpu: "300m"}
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: positions
              mountPath: /run/promtail
            # Log files are symlinked into /var/log/pods from /var/lib/docker;
            # both mounts are required or promtail reads dangling links.
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: containers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: positions
          emptyDir: {}
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: containers
          hostPath:
            path: /var/lib/docker/containers
