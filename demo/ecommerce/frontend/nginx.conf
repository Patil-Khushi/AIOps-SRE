server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the runtime config.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Product photos. Excluded from the SPA fallback below: without this, a
    # missing image returns index.html with HTTP 200, so the browser downloads
    # the whole app HTML per broken <img> and the failure reads as a success
    # in the network tab. A real 404 lets Tile.jsx fall back to its icon fast.
    location /products/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Content-hashed build output — safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}