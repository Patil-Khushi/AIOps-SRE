# NodePort bridges: k3s -> reachable from the Docker Compose network.
#
# ONLY needed for the Compose deployment. The k8s deployment (demo/ecommerce/k8s/)
# reaches both backends over in-cluster DNS and needs none of this.
#
# The ecommerce app runs in Docker Compose; Jaeger/Loki/Prometheus/Grafana run in
# Rancher Desktop's k3s. Both live in the same Rancher Desktop VM network
# (192.168.127.0/24), so a NodePort is all that's needed — no port-forward, no
# tunnel, and nothing to keep alive in a terminal.
#
# Verified reachable from a Compose container:
#   k3s node    = 192.168.127.2      (compose -> cluster, via these NodePorts)
#   host gateway= 192.168.127.254    (cluster -> compose, for Prometheus scrape)
#
# Apply:  kubectl apply -f observability/nodeports.yaml
# Remove: kubectl delete -f observability/nodeports.yaml
#
# These are additive Services. They do NOT modify the Helm-managed `jaeger` /
# `loki` Services or their workloads, so `helm upgrade` and `infra/teardown.ps1`
# behave exactly as before.
#
# NOTE the namespaces differ: Jaeger lives in `observability` (installed by
# infra/observability/install.ps1), Loki in `otel-demo` (its own older release,
# left there because moving it would drop its PVC). A NodePort Service must sit
# in the same namespace as the pods it selects, hence one of each.
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ecommerce
  namespace: observability
  labels:
    app.kubernetes.io/part-of: ecommerce-bridge
spec:
  type: NodePort
  # allInOne mode: one pod carries every port, selected by the release labels.
  # There is no separate collector Deployment to point at.
  selector:
    app.kubernetes.io/instance: jaeger
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: all-in-one
  ports:
    # The ecommerce services export spans over OTLP/gRPC (see each service's
    # main.py — it uses the grpc trace exporter, not http/protobuf).
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      nodePort: 30317
      protocol: TCP
    # Exposed too, so a curl/HTTP client can push OTLP without a gRPC stack.
    - name: otlp-http
      port: 4318
      targetPort: 4318
      nodePort: 30318
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: loki-ecommerce
  namespace: otel-demo
  labels:
    app.kubernetes.io/part-of: ecommerce-bridge
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: single-binary
    app.kubernetes.io/instance: loki
    app.kubernetes.io/name: loki
  ports:
    # Each service pushes its own log lines to /loki/api/v1/push here (see
    # src/observability/loki_handler.py in each service). Applications ship logs
    # directly from inside the process, no sidecar required.
    - name: http
      port: 3100
      targetPort: 3100
      nodePort: 30310
      protocol: TCP
