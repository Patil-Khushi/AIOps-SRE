# Scenario definition for the ecommerce SRE demo.
# Generated to stay in sync with failure_injection registry.
id: payment_service_http_500
title: HTTP 500 errors
service: payment-service
failure_key: payment_service.http_500
severity: high
inject:
  command: python -m failure_injection inject payment_service.http_500
recover:
  command: python -m failure_injection recover payment_service.http_500
load:
  url: http://localhost:8003/payments
  method: POST
  body:
    order_id: 1
    amount: 12.0
  duration_seconds: 60
detection:
  l1: 5xx rate on /payments increases; payment_failures_total{reason=injected_500} rising
  l2: Payment logs show the injected failure
  http_status:
  - 500
  metrics:
  - name: payment_failures_total{reason="injected_500"}
    expect: increases
  logs:
  - level: ERROR
    contains: injected HTTP 500 on payment
expected_rca: Payment application failure
truth_file: truth_files/payment_service_http_500.json
settle_seconds: 20