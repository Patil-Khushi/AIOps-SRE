# Scenario definition for the ecommerce SRE demo.
# Generated to stay in sync with failure_injection registry.
id: user_service_mysql_down
title: MySQL database down
service: user-service
failure_key: user_service.mysql_down
severity: critical
inject:
  command: python -m failure_injection inject user_service.mysql_down
recover:
  command: python -m failure_injection recover user_service.mysql_down
load: null
detection:
  l1: login_failure_total rising; HTTP 500 on /login; mysql_connection_status=0
  l2: 'Logs: ''database connection failed'' / connection refused to mysql:3306'
  http_status:
  - 500
  metrics:
  - name: login_failure_total
    expect: increases
  - name: mysql_connection_status
    expect: == 0
  logs:
  - level: ERROR
    contains: database connection failed
expected_rca: MySQL database unavailable
truth_file: truth_files/user_service_mysql_down.json
settle_seconds: 20