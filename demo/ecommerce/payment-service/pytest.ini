[pytest]
# Makes `from src.main import app` resolvable: this service's own root (not
# the repo root) must be on sys.path so `src` resolves as a package. Each
# ecommerce service has its own top-level `src/`, so these can't be collected
# together from the repo root — run pytest from inside this directory (or see
# the per-service CI job in .github/workflows/ci.yml).
pythonpath = .
testpaths = tests
