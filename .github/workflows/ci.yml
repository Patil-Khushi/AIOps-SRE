name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Install deps
        # --locked: fail if uv.lock is out of step with pyproject.toml, so a
        # dependency change not accompanied by a committed `uv lock` is caught
        # here instead of silently re-resolving — the floating-dependency class
        # of bug that reddened CI before the lockfile was committed (see #155).
        run: uv sync --locked --extra dev --extra ui

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: pytest
        env:
          AIOPS_LLM_PROVIDER: stub
        run: uv run pytest

      - name: eval gate
        env:
          AIOPS_LLM_PROVIDER: stub
        run: uv run python -m evals.harness --ci --min-pass-rate 0.85

  ecommerce-service-tests:
    # The order/payment/user FastAPI services each ship their own `src/` and
    # `tests/` and are NOT part of the root uv workspace (they're standalone
    # containers with a plain requirements.txt) — the root testpaths
    # deliberately excludes demo/ecommerce/** because three same-named `src`
    # packages would collide if collected together. Test each in isolation.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, payment-service, user-service]
    defaults:
      run:
        working-directory: demo/ecommerce/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install service + test deps
        # httpx is needed by fastapi.testclient.TestClient; it's already a
        # production dependency of order/payment-service (they call
        # downstream services over HTTP) but not of user-service, so it's
        # installed here explicitly rather than added to requirements.txt.
        run: pip install -r requirements.txt pytest httpx

      - name: pytest
        run: pytest

  policy-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
      - name: opa fmt --diff
        run: opa fmt --diff policies/
      - name: opa check
        run: opa check policies/
