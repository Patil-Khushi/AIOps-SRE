# Alert rules for the AIOps demo.
#
# These rules fire when flagd-toggled failure scenarios cause measurable
# anomalies in the OTel-demo's HTTP-client instrumentation metrics.
# Thresholds are deliberately loose so the demo loop (flip flag → wait ~90 s
# → alert fires → agent triages) feels responsive.
#
# Apply by patching the `prometheus` ConfigMap in namespace `otel-demo`:
#   kubectl patch cm prometheus -n otel-demo --type merge \
#     -p (ConvertTo-Json @{data=@{'alerting_rules.yml' = (Get-Content $f -Raw)}} -Depth 5 -Compress)

groups:
  - name: aiops-demo
    interval: 30s
    rules:

      - alert: PaymentErrorRateHigh
        expr: |
          sum by (service_name) (
            rate(http_client_duration_milliseconds_count{service_name="payment",http_status_code!~"2.."}[2m])
          ) > 0
        for: 30s
        labels:
          severity: critical
          service: payment
          alert_type: error_rate
        annotations:
          summary: Payment service returning HTTP 5xx errors
          description: 'service={{ $labels.service_name }} 5xx-rate={{ $value }}/s'
          runbook_url: https://runbooks.example.com/payment-cpu
          flag_hint: 'toggle paymentFailure=on at http://localhost:8080/feature/'

      - alert: CartErrorRateHigh
        expr: |
          sum by (service_name) (
            rate(http_client_duration_milliseconds_count{service_name="cart",http_status_code!~"2.."}[2m])
          ) > 0
        for: 30s
        labels:
          severity: high
          service: cart
          alert_type: error_rate
        annotations:
          summary: Cart service returning HTTP 5xx errors
          description: 'service={{ $labels.service_name }} 5xx-rate={{ $value }}/s'
          runbook_url: https://runbooks.example.com/cart
          flag_hint: 'toggle cartFailure=on at http://localhost:8080/feature/'

      - alert: ProductCatalogErrorRateHigh
        expr: |
          sum by (service_name) (
            rate(http_client_duration_milliseconds_count{service_name="product-catalog",http_status_code!~"2.."}[2m])
          ) > 0
        for: 30s
        labels:
          severity: high
          service: product-catalog
          alert_type: error_rate
        annotations:
          summary: Product catalog service returning HTTP 5xx errors
          description: 'service={{ $labels.service_name }} 5xx-rate={{ $value }}/s'
          runbook_url: https://runbooks.example.com/catalog
          flag_hint: 'toggle productCatalogFailure=on at http://localhost:8080/feature/'

      - alert: RecommendationLatencyP95High
        expr: |
          histogram_quantile(0.95, sum by (le, service_name) (
            rate(http_client_duration_milliseconds_bucket{service_name="recommendation"}[5m])
          )) > 1000
        for: 2m
        labels:
          severity: high
          service: recommendation
          alert_type: latency
        annotations:
          summary: Recommendation service p95 latency above 1 s
          description: 'service={{ $labels.service_name }} p95={{ $value }}ms'
          runbook_url: https://runbooks.example.com/recommendation
          flag_hint: 'toggle recommendationCacheFailure=on at http://localhost:8080/feature/'

      - alert: FrontendTrafficSurge
        expr: |
          sum by (service_name) (
            rate(http_client_duration_milliseconds_count{service_name="frontend"}[2m])
          ) > 10
        for: 30s
        labels:
          severity: warning
          service: frontend
          alert_type: traffic
        annotations:
          summary: Frontend request rate above 10 req/s (load surge)
          description: 'service={{ $labels.service_name }} rate={{ $value }}/s'
          runbook_url: https://runbooks.example.com/frontend
          flag_hint: 'toggle loadGeneratorFloodHomepage=on at http://localhost:8080/feature/'

      - alert: AdErrorRateHigh
        expr: |
          sum by (service_name) (
            rate(http_client_duration_milliseconds_count{service_name="ad",http_status_code!~"2.."}[2m])
          ) > 0
        for: 30s
        labels:
          severity: high
          service: ad
          alert_type: error_rate
        annotations:
          summary: Ad service returning HTTP errors
          description: 'service={{ $labels.service_name }} non-2xx rate={{ $value }}/s'
          runbook_url: https://runbooks.example.com/ad
          flag_hint: 'toggle adFailure=on at http://localhost:8080/feature/'

      - alert: AdLatencyP95High
        expr: |
          histogram_quantile(0.95, sum by (le, service_name) (
            rate(http_client_duration_milliseconds_bucket{service_name="ad"}[5m])
          )) > 800
        for: 2m
        labels:
          severity: high
          service: ad
          alert_type: latency
        annotations:
          summary: Ad service p95 latency above 800 ms
          description: 'service={{ $labels.service_name }} p95={{ $value }}ms'
          runbook_url: https://runbooks.example.com/ad
          flag_hint: 'toggle adManualGc=on at http://localhost:8080/feature/'

      - alert: AdCpuHigh
        expr: |
          sum by (service_name) (
            rate(otelcol_process_cpu_seconds_total{service_name="ad"}[2m])
          ) > 0.8
        for: 2m
        labels:
          severity: warning
          service: ad
          alert_type: saturation
        annotations:
          summary: Ad service CPU above 80%
          description: 'service={{ $labels.service_name }} cpu_seconds_rate={{ $value }}'
          runbook_url: https://runbooks.example.com/ad
          flag_hint: 'toggle adHighCpu=on at http://localhost:8080/feature/'

      - alert: FrontendImageLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le, service_name) (
            rate(http_client_duration_milliseconds_bucket{service_name="frontend"}[5m])
          )) > 3000
        for: 2m
        labels:
          severity: high
          service: frontend
          alert_type: latency
        annotations:
          summary: Frontend p95 latency above 3 s (likely slow image loads)
          description: 'service={{ $labels.service_name }} p95={{ $value }}ms'
          runbook_url: https://runbooks.example.com/frontend
          flag_hint: 'toggle imageSlowLoad=10sec at http://localhost:8080/feature/'

      - alert: CheckoutBackpressureHigh
        expr: |
          sum by (service_name) (
            rate(http_client_duration_milliseconds_count{service_name="checkout",http_status_code!~"2.."}[2m])
          ) > 0
        for: 1m
        labels:
          severity: high
          service: checkout
          alert_type: backpressure
        annotations:
          summary: Checkout pipeline returning errors (likely Kafka backpressure)
          description: 'service={{ $labels.service_name }} non-2xx rate={{ $value }}/s'
          runbook_url: https://runbooks.example.com/checkout
          flag_hint: 'toggle kafkaQueueProblems=on at http://localhost:8080/feature/'

      - alert: EmailMemoryHigh
        expr: |
          avg by (service_name) (
            otelcol_process_memory_rss_bytes{service_name="email"}
          ) > 500000000
        for: 2m
        labels:
          severity: high
          service: email
          alert_type: memory
        annotations:
          summary: Email service RSS memory above 500 MB
          description: 'service={{ $labels.service_name }} rss_bytes={{ $value }}'
          runbook_url: https://runbooks.example.com/email
          flag_hint: 'toggle emailMemoryLeak=100x at http://localhost:8080/feature/'
