# OpenTelemetry Collector for the ecommerce SUT.
#
# Chart: open-telemetry/opentelemetry-collector
#
# Replaces the collector that came as an opentelemetry-demo subchart. Scope is
# deliberately narrower than the demo's: that one carried receivers for
# hostmetrics, kubeletstats, k8s_cluster, kafkametrics, zipkin and jaeger, most
# of which logged errors once the demo workloads were scaled to zero.
#
# This one does one job: accept OTLP traces from the ecommerce services and
# forward them to Jaeger.
#
# Logs are NOT handled here. The demo collector's logs pipeline had only an
# `otlp` receiver and no `filelog`, so pod stdout never reached it — which is
# why demo/ecommerce/k8s/40-promtail.yaml exists. Promtail tails the pods and
# writes straight to Loki, bypassing the collector entirely.

mode: deployment
replicaCount: 1

resources:
  requests: {memory: "192Mi", cpu: "100m"}
  limits: {memory: "384Mi"}

image:
  repository: otel/opentelemetry-collector-contrib

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    # Chart defaults we do not use; emptied so the collector does not start
    # scrapers for workloads that no longer exist.
    jaeger: null
    zipkin: null
    prometheus: null

  processors:
    batch: {}
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25

  exporters:
    otlp/jaeger:
      # allInOne exposes ONE Service named `jaeger` carrying every port,
      # including OTLP 4317 — there is no separate `jaeger-collector` Service
      # in this mode (that only exists in the split collector/query topology).
      # Verify after any chart bump: kubectl -n observability get svc
      endpoint: jaeger.observability.svc.cluster.local:4317
      tls:
        insecure: true

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/jaeger]
      # No metrics or logs pipeline: Prometheus scrapes /metrics directly and
      # promtail ships logs directly. Routing either through the collector
      # would add a hop and a failure mode for no benefit.
      metrics: null
      logs: null

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
