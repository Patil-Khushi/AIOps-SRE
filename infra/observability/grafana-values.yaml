# Grafana for the ecommerce SUT.
#
# Chart: grafana/grafana
#
# Replaces the Grafana that came as an opentelemetry-demo subchart. The three
# datasources are declared here rather than left to the sidecar-discovered
# ConfigMaps the demo chart used, so the whole stack is reproducible from this
# file alone.
#
# Datasource UIDs are kept STABLE across the migration
# (webstore-metrics / webstore-traces) because saved dashboards and the
# auto_ticketing panel-render path (RA-003) reference datasources by uid, not
# by name. Renaming them would silently break every existing panel link.

adminUser: admin
adminPassword: admin        # demo only; never a real credential

resources:
  requests: {memory: "256Mi", cpu: "100m"}
  limits: {memory: "512Mi"}

persistence:
  enabled: false            # dashboards come from provisioning, not the DB

# Redis is not a core Grafana datasource, so the plugin is downloaded from
# grafana.com on pod start. That makes Grafana's startup depend on the network:
# if this box is offline the pod will not become ready. Drop this list (and the
# "Redis (payments)" datasource below) to go back to a fully air-gapped install.
plugins:
  - redis-datasource

# Served under /grafana so the existing bookmarks and the RA-003 render URLs
# keep working after frontend-proxy (an OTel Demo component) goes away.
grafana.ini:
  server:
    root_url: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
    serve_from_sub_path: true
  auth.anonymous:
    enabled: true
    org_role: Viewer

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: webstore-metrics
        type: prometheus
        access: proxy
        url: http://prometheus-server.observability.svc.cluster.local
        isDefault: true

      - name: Loki
        uid: ecommerce-logs
        type: loki
        access: proxy
        # Loki is a SEPARATE helm release and deliberately stays where it is —
        # moving it would drop its PVC and every log line collected so far.
        url: http://loki.otel-demo.svc.cluster.local:3100
        jsonData:
          maxLines: 1000

      - name: Jaeger
        uid: webstore-traces
        type: jaeger
        access: proxy
        # allInOne exposes one Service named `jaeger` with every port; there is
        # no `jaeger-query` Service in this mode.
        url: http://jaeger.observability.svc.cluster.local:16686

      # ── application databases ────────────────────────────────────────────
      # The SUT's own data, browsable in Grafana Explore next to the metrics,
      # logs and traces — so "what did the app actually store?" is one click
      # away from "what did the alert say?", instead of a kubectl exec.
      #
      # These are the demo credentials from demo/ecommerce/k8s/01-config.yaml.
      # They guard nothing real. Do NOT copy this pattern for a datastore with
      # actual data in it — use Grafana's secure JSON fields and a read-only
      # database role instead.
      - name: MySQL (users)
        uid: ecommerce-mysql
        type: mysql
        url: mysql.ecommerce.svc.cluster.local:3306
        database: users
        user: appuser
        secureJsonData:
          password: apppass
        jsonData:
          maxOpenConns: 5

      # payment-service stores each payment as a JSON string under
      # `payment:<id>` (payment-service/src/db/redis_client.py) — there is no
      # payments table in MySQL or Postgres, so without this datasource a
      # successful payment is invisible everywhere except the Prometheus
      # counters. No password: the demo Redis runs unauthenticated.
      - name: Redis (payments)
        uid: ecommerce-redis
        type: redis-datasource
        url: redis://redis.ecommerce.svc.cluster.local:6379
        jsonData:
          client: standalone
          poolSize: 5
          timeout: 10
          pingInterval: 0
          pipelineWindow: 0

      - name: PostgreSQL (orders)
        uid: ecommerce-postgres
        # NOT `postgres`. Grafana 11 renamed this plugin's id to
        # `grafana-postgresql-datasource`, and the legacy name is only half
        # aliased: the backend still resolves it, so `/api/datasources/.../health`
        # returns "Database Connection OK" and `/api/ds/query` returns rows —
        # but the browser cannot resolve the plugin and every panel renders
        # "No data" with an error badge. Backend-green / frontend-dead is the
        # signature, and it makes the datasource look healthy while being
        # unusable. MySQL is unaffected because `mysql` is still its real id.
        type: grafana-postgresql-datasource
        url: postgres.ecommerce.svc.cluster.local:5432
        database: orders
        user: appuser
        secureJsonData:
          password: apppass
        jsonData:
          # The StatefulSet runs plain postgres with no TLS, so requiring SSL
          # here would fail every query with "server does not support SSL".
          sslmode: disable
          maxOpenConns: 5

# Server-side panel rendering, so RA-003 Auto-Ticketing can attach the
# breaching panel as a PNG to a ServiceNow incident. Kept from the demo chart's
# configuration: the stock Grafana image lacks the Chromium libs the in-pod
# plugin needs, so the separate renderer pod is the supported route.
imageRenderer:
  enabled: true
  # LOAD BEARING, and the failure it prevents is deeply unobvious.
  #
  # The chart builds GF_RENDERING_CALLBACK_URL — the address the renderer uses
  # to call *back* into Grafana — from the service name alone, with no idea that
  # `serve_from_sub_path` is on above. Left empty it produces
  # `http://grafana.observability:80/`, so the renderer requests `/d-solo/...`
  # instead of `/grafana/d-solo/...`. Grafana's subpath middleware then 302s
  # that to the absolute root_url, and because `domain` is unset the redirect
  # target is `http://localhost:3000/grafana/d-solo/...` — localhost being the
  # *renderer's* own pod, where nothing listens. Chromium reports
  # ERR_CONNECTION_REFUSED and the render 500s.
  #
  # Nothing surfaces that: RA-003 treats a failed render as non-fatal and files
  # the ticket without the screenshot, so the only symptom is incidents quietly
  # arriving with no evidence attached.
  grafanaSubPath: grafana
  resources:
    requests: {memory: "128Mi", cpu: "50m"}
    limits: {memory: "384Mi"}
