# Grafana datasource for Loki (RA-007 / #220) — optional but handy: it puts
# Loki in Grafana Explore so you can eyeball the ingested log streams (and
# confirm the `service_name` label matches what the loki provider queries)
# without leaving the demo.
#
# The OTel demo's Grafana runs a sidecar that auto-loads any ConfigMap in the
# Grafana namespace labeled `grafana_datasource: "1"` into
# /etc/grafana/provisioning/datasources. Apply with (bootstrap.ps1 does this
# with `-n $Namespace` so a parameterised install lands it in the right place):
#   kubectl apply -n otel-demo -f infra/loki-grafana-datasource.yaml
# then reload Grafana (the sidecar hits its reload endpoint automatically) and
# open http://localhost:8080/grafana/explore -> pick "Loki".
#
# No `namespace:` here on purpose — the `kubectl -n` flag decides where it
# lands, so a non-default $Namespace install still places the datasource next
# to Grafana (a hardcoded namespace would strand it where the sidecar can't see it).
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-grafana-datasource
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        # In-cluster single-binary Loki service (infra/loki-values.yaml).
        url: http://loki:3100
        isDefault: false
        jsonData:
          # Single-tenant (auth_enabled: false) — no X-Scope-OrgID needed.
          maxLines: 1000
